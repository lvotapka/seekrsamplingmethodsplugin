# Helper file to handle all configs

[coverage:run]
# .coveragerc to control coverage.py and pytest-cov
omit =
    # Omit the tests
    */tests/*
    # Omit generated versioneer
    seekrsamplingmethodsplugin/_version.py

[yapf]
# YAPF, in .style.yapf files this shows up as "[style]" header
COLUMN_LIMIT = 119
INDENT_WIDTH = 4
USE_TABS = False

[flake8]
# Flake8, PyFlakes, etc
max-line-length = 119

[tool:pytest]
addopts = -vv
testpaths = seekrsamplingmethodsplugin/tests
markers =
    needs_cuda: marks tests as needing CUDA to run.
    needs_openmm: marks tests as needing OpenMM to run.
    slow: marks tests as slow; skipped by default, run with --full.


[aliases]
test = pytest
